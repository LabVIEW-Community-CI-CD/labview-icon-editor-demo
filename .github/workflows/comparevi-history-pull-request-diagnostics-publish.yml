name: CompareVI History Pull Request Diagnostics Publish

on:
  workflow_run:
    workflows:
      - CompareVI History Pull Request Diagnostics
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comparevi-history-pull-request-diagnostics-publish:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    uses: LabVIEW-Community-CI-CD/comparevi-history/.github/workflows/pull-request-diagnostics-publish.yml@v1.3.12
    with:
      consumer_repository: ${{ github.repository }}
      workflow_run_id: ${{ github.event.workflow_run.id }}
      artifact_name: comparevi-history-pr-diagnostics-${{ github.event.workflow_run.id }}
      platform_ref: v1.3.12
