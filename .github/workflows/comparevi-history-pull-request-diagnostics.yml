name: CompareVI History Pull Request Diagnostics

on:
  pull_request:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - hotfix/*
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  comparevi-history-pull-request-diagnostics:
    uses: LabVIEW-Community-CI-CD/comparevi-history/.github/workflows/pull-request-diagnostics-auto.yml@d0e92af4f36da76c946a194efe4c2cc79590629d
    with:
      consumer_repository: ${{ github.repository }}
      pr_policy_path: .github/comparevi-history-pr-policy.json
      results_dir: tests/results/pr-diagnostics/history
      platform_ref: d0e92af4f36da76c946a194efe4c2cc79590629d
