name: CompareVI History Manual VI Exploration

on:
  workflow_dispatch:
    inputs:
      vi_path:
        description: Repository-relative `.vi` path to explore
        required: true
        type: string
      ref:
        description: Repository ref to inspect
        required: false
        default: develop
        type: string
      compare_modes:
        description: Trusted raw compare mode bundle for manual exploration
        required: false
        default: full
        type: string
      include_merge_parents:
        description: Walk merge parents alongside the mainline when building the revision catalog
        required: false
        default: false
        type: boolean
      noise_policy:
        description: Trusted noise policy for manual exploration
        required: false
        default: include
        type: string

permissions:
  contents: read

jobs:
  comparevi-history-manual-vi-exploration:
    uses: LabVIEW-Community-CI-CD/comparevi-history/.github/workflows/manual-vi-exploration.yml@v1.3.7
    with:
      consumer_repository: ${{ github.repository }}
      consumer_ref: ${{ inputs.ref }}
      vi_path: ${{ inputs.vi_path }}
      modes: ${{ inputs.compare_modes }}
      include_merge_parents: ${{ inputs.include_merge_parents }}
      noise_policy: ${{ inputs.noise_policy }}
      platform_ref: v1.3.7
